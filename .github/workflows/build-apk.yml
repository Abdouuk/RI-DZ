name: Build RI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "--- before ---"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          echo "--- after ---"
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer and Gradle
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle
            ~/.cache
          key: buildozer-ri-${{ runner.os }}-${{ hashFiles('buildozer.spec', '.github/workflows/build-apk.yml') }}
          restore-keys: |
            buildozer-ri-${{ runner.os }}-

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk build-essential python3-dev python3-pip \
            python3-setuptools python3-wheel autoconf automake libtool libtool-bin \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev ffmpeg m4

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --break-system-packages buildozer "cython==0.29.36" "setuptools<70" wheel virtualenv

      - name: Prepare Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          # buildozer يبحث عن sdkmanager في المسار القديم tools/bin
          if [ ! -e "$SDK/tools" ]; then
            sudo ln -sfn "$SDK/cmdline-tools/latest" "$SDK/tools"
          fi
          yes | sudo "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          # p4a يبحث عن SDK داخل مجلد buildozer، فنوجهه إلى SDK الجاهز
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sfn "$SDK" "$HOME/.buildozer/android/platform/android-sdk"
          ls "$HOME/.buildozer/android/platform/android-sdk/build-tools" || true

      - name: Build Android APK
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          rm -rf .buildozer/android/platform/build-*/build/other_builds/libffi || true
          set +e
          buildozer android debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "buildozer exit code: $status"
          echo "--- memory and disk at the end ---"
          free -m || true
          df -h / || true
          if [ "$status" -ne 0 ]; then
            echo "=== LAST 200 LINES OF build.log ==="
            tail -n 200 build.log
            echo "=== ERROR LINES ==="
            grep -n -iE "error|failed|killed|no space|traceback" build.log | tail -n 80 || true
          fi
          exit "$status"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RI-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14