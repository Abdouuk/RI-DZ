name: Build RI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      ACLOCAL_PATH: /usr/share/aclocal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer and Gradle
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.gradle
            ~/.cache
          key: buildozer-ri-${{ runner.os }}-${{ hashFiles('buildozer.spec', '.github/workflows/build-apk.yml') }}
          restore-keys: |
            buildozer-ri-${{ runner.os }}-

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk build-essential python3-dev python3-pip \
            python3-setuptools python3-wheel autoconf automake libtool libtool-bin \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev \
            libssl-dev ffmpeg m4

      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --break-system-packages buildozer "cython==0.29.36" "setuptools<70" wheel virtualenv

      - name: Build Android APK
        run: |
          set -o pipefail
          rm -rf .buildozer/android/platform/build-*/build/other_builds/libffi
          buildozer android debug 2>&1 | tee build.log || {
            echo "=== ERROR CONTEXT BEFORE ENVIRONMENT ==="
            awk '/[Ee]rror/{print NR": "$0}' build.log | tail -n 60
            exit 1
          }
